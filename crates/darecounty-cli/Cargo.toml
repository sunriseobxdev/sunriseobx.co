[package]
name = "darecounty-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "darecounty-cli"
path = "src/main.rs"

[dependencies]
darecounty-common = { path = "../darecounty-common" }
darecounty-sys = { path = "../darecounty-sys" }
clap = { version = "4", features = ["derive"] }
tokio = { workspace = true }
serde_json = { workspace = true }
csv = "1"
env_logger = "0.11"
log = { workspace = true }
