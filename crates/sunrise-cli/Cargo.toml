[package]
name = "sunrise-cli"
version = "0.1.0"
edition = "2021"
description = "CLI for the SunriseOBX admin API"

[[bin]]
name = "sunrise-cli"
path = "src/main.rs"

[dependencies]
sunrise-common = { workspace = true }
sunrise-sys = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
env_logger = "0.11"
log = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "rustls-tls"] }
tonic = "0.12"
prost = "0.13"
tokio-stream = "0.1"
libc = "0.2"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
http = "1"
quick-xml = { version = "0.37", features = ["serialize"] }

[features]
default = []
fuse = ["fuser"]

[target.'cfg(unix)'.dependencies]
fuser = { version = "0.15", optional = true }

[build-dependencies]
tonic-build = "0.12"
