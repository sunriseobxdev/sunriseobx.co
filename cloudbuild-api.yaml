steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/sunriseobx-images/api:${_TAG}'
      - '-f'
      - 'services/api/Dockerfile'
      - '.'
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/sunriseobx-images/api:${_TAG}'
  - name: 'gcr.io/cloud-builders/kubectl'
    args: ['rollout', 'restart', 'deployment/sunriseobx-api', '-n', 'sunriseobx']
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=us-central1-a'
      - 'CLOUDSDK_CONTAINER_CLUSTER=sunriseobx'
  - name: 'gcr.io/cloud-builders/kubectl'
    args: ['rollout', 'status', 'deployment/sunriseobx-api', '-n', 'sunriseobx', '--timeout=300s']
    env:
      - 'CLOUDSDK_COMPUTE_ZONE=us-central1-a'
      - 'CLOUDSDK_CONTAINER_CLUSTER=sunriseobx'
images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/sunriseobx-images/api:${_TAG}'
substitutions:
  _TAG: latest
timeout: 600s
options:
  machineType: 'E2_HIGHCPU_8'
