apiVersion: apps/v1
kind: Deployment
metadata:
  name: sunriseobx-cdn
  namespace: sunriseobx
  labels:
    app: cdn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cdn
  template:
    metadata:
      labels:
        app: cdn
    spec:
      containers:
        - name: cdn
          image: us-central1-docker.pkg.dev/sunriseobx-proj/sunriseobx-images/cdn:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: GCS_CDN_BUCKET
              value: sunriseobx-cdn
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
