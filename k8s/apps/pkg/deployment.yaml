apiVersion: apps/v1
kind: Deployment
metadata:
  name: sunriseobx-pkg
  namespace: sunriseobx
  labels:
    app: sunriseobx-pkg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sunriseobx-pkg
  template:
    metadata:
      labels:
        app: sunriseobx-pkg
    spec:
      tolerations:
        - key: cloud.google.com/gke-spot
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: pkg
          image: us-central1-docker.pkg.dev/sunriseobx-proj/sunriseobx-images/pkg:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: GCS_PKG_BUCKET
              value: "sunriseobx-proj-packages"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: sunriseobx-pkg
  namespace: sunriseobx
spec:
  type: ClusterIP
  selector:
    app: sunriseobx-pkg
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
